name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"
  # Interpreter that generates the committed type stubs (see the `stubs` job).
  STUB_PYTHON: "3.13"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: ruff check
        run: uv run ruff check --output-format=github custom_components tests react_globe_gl_demo

      - name: ruff format --check
        run: uv run ruff format --check --diff custom_components tests react_globe_gl_demo

  stubs:
    name: Type stubs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      # Pinned on purpose. The generator renders each docstring from the imported
      # object's __doc__, and Python 3.13 dedents docstrings at compile time while
      # 3.12 does not -- so the same source produces a different .pyi per interpreter.
      # Stubs are generated on ${{ env.STUB_PYTHON }}; see CONTRIBUTING.md.
      - name: Install dependencies
        run: uv sync --all-extras --frozen --python ${{ env.STUB_PYTHON }}

      # The generator imports every module by dotted path, so the repository root must
      # be on PYTHONPATH -- without it every import fails, the stub is never refreshed,
      # and the command still exits 0.
      - name: Regenerate stubs
        run: PYTHONPATH=. uv run --python ${{ env.STUB_PYTHON }} reflex component build

      - name: Fail if the committed stub is stale
        run: |
          if ! git diff --exit-code -- custom_components/reflex_react_globe_gl/react_globe_gl.pyi; then
            echo "::error::react_globe_gl.pyi is out of date. Run 'PYTHONPATH=. uv run reflex component build' and commit the result."
            exit 1
          fi

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      # test_wrapper_js.py runs globe_wrapper.js under Node; without Node it skips,
      # which would silently drop the JS coverage in CI.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --python ${{ matrix.python-version }}

      - name: Verify Node is available to the JS tests
        run: node --version

      - name: pytest
        run: uv run pytest -v --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata renders on PyPI
        run: uvx twine check --strict dist/*

      # The component is useless without its JS wrapper: assert it is actually packaged
      # rather than trusting the package-data glob.
      - name: Assert the JS wrapper ships in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "reflex_react_globe_gl/globe_wrapper.js",
              "reflex_react_globe_gl/react_globe_gl.pyi",
              "reflex_react_globe_gl/py.typed",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit(f"missing from {wheel}: {missing}")
          print(f"{wheel} contains all required data files")
          PY

      - name: Install the wheel into a clean env and import it
        run: |
          uv venv /tmp/smoke
          VIRTUAL_ENV=/tmp/smoke uv pip install dist/*.whl
          cd /tmp && VIRTUAL_ENV=/tmp/smoke uv run python -c "
          import reflex_react_globe_gl as rg
          assert rg.Globe.create(id='g') is not None
          print('wheel import OK', rg.REACT_GLOBE_GL_VERSION)
          "

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  demo:
    name: Demo app compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # Exercises rxconfig.py, every page module and the component's compiled output --
      # this is the check that would have caught the reflex-base/radix version skew.
      - name: Export the demo frontend
        working-directory: react_globe_gl_demo
        run: uv run reflex export --frontend-only --no-zip --loglevel debug

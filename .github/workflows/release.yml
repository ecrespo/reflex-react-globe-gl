name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      test_pypi:
        description: "Publish to TestPyPI instead of PyPI"
        type: boolean
        default: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.7"

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      # A tag that disagrees with pyproject.toml would publish a version nobody can
      # reproduce from the tag, and PyPI never lets that number be reused.
      - name: Check the tag matches pyproject.toml
        id: version
        run: |
          project_version="$(uv run python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          echo "version=${project_version}" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag_version="${GITHUB_REF_NAME#v}"
            if [ "${tag_version}" != "${project_version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match project version ${project_version}"
              exit 1
            fi
          fi
          echo "Releasing version ${project_version}"

      - name: Lint
        run: |
          uv run ruff check custom_components tests react_globe_gl_demo
          uv run ruff format --check custom_components tests react_globe_gl_demo

      - name: Tests
        run: uv run pytest -q

      - name: Security scan
        run: |
          uv run bandit -c pyproject.toml -r custom_components -f screen
          uv run pip-audit --progress-spinner off --skip-editable

      # PyPI rejects an unknown trove classifier with a 400 at upload time, and
      # `twine check --strict` does not catch it -- it validates the README, not the
      # classifier list. Fail here instead of after the release tag is already pushed.
      - name: Validate trove classifiers
        run: |
          uv run python - <<'PY'
          import sys, tomllib, pathlib
          from trove_classifiers import classifiers as valid
          declared = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["classifiers"]
          bad = [c for c in declared if c not in valid]
          if bad:
              sys.exit(f"not valid PyPI classifiers: {bad}")
          print(f"all {len(declared)} classifiers are valid")
          PY

      - name: Build sdist and wheel
        run: uv build

      - name: Validate metadata
        run: uvx twine check --strict dist/*

      - name: Assert the JS wrapper ships in the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "reflex_react_globe_gl/globe_wrapper.js",
              "reflex_react_globe_gl/react_globe_gl.pyi",
              "reflex_react_globe_gl/py.typed",
          ]
          missing = [n for n in required if n not in names]
          if missing:
              sys.exit(f"missing from {wheel}: {missing}")
          print(f"{wheel} contains all required data files")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: build
    if: github.event_name == 'push' || inputs.test_pypi == false
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/reflex-react-globe-gl
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored anywhere.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
          print-hash: true

  testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.test_pypi
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/reflex-react-globe-gl
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          print-hash: true

  github-release:
    name: GitHub Release
    needs: [build, pypi]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Extract the release notes for this version
        id: notes
        run: |
          version="${{ needs.build.outputs.version }}"
          # Pull the section for this version out of CHANGELOG.md; fall back to a stub.
          awk -v v="## [${version}]" '
            index($0, v) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${version}." > release-notes.md
          fi
          cat release-notes.md

      - name: Create the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

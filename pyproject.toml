[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-react-globe-gl"
version = "0.1.0"
description = "react-globe.gl for Reflex: 3D globe data visualization (points, arcs, polygons, paths, heatmaps, hexbins, tiles, particles, rings, labels, HTML markers, 3D objects and custom ThreeJS layers)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ernesto Crespo", email = "ecrespo@gmail.com" }]
keywords = [
    "reflex",
    "reflex-custom-components",
    "globe",
    "react-globe.gl",
    "globe.gl",
    "threejs",
    "webgl",
    "data-visualization",
    "geospatial",
]
dependencies = ["reflex>=0.9.12"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Reflex",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: JavaScript",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: GIS",
]

[project.urls]
Homepage = "https://github.com/ecrespo/reflex-react-globe-gl"
Source = "https://github.com/ecrespo/reflex-react-globe-gl"
Issues = "https://github.com/ecrespo/reflex-react-globe-gl/issues"
Upstream = "https://github.com/vasturiano/react-globe.gl"

[project.optional-dependencies]
dev = [
    "build",
    "twine",
    "pytest",
    "pytest-cov",
    "ruff>=0.14",
    "bandit[toml]>=1.8",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.setuptools.package-data]
reflex_react_globe_gl = ["*.js", "*.pyi", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".web", ".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
]
ignore = [
    "D203",   # incompatible with D211 (ruff's default choice)
    "D213",   # incompatible with D212 (ruff's default choice)
    "E501",   # line length is enforced by `ruff format`; upstream prop docs overflow on purpose
    "ANN401", # accessor props and JS callbacks are genuinely `Any`
    "ANN002", # *children / *args on rx.Component.create follow the Reflex signature
    "ANN003", # **props on rx.Component.create follow the Reflex signature
    "RUF001", # en dashes in prose are intentional
    "RUF002",
    "RUF012", # rx.State/rx.Component class attrs are mutable by design; Reflex deep-copies them
]

[tool.ruff.lint.per-file-ignores]
# Event-spec functions must stay un-annotated: a return annotation switches Reflex
# to strict event-argument type checking and breaks handlers that narrow the type.
"custom_components/reflex_react_globe_gl/react_globe_gl.py" = ["ANN202"]
"*.pyi" = ["D", "ANN", "E", "F", "I", "UP", "B"]
"tests/*" = ["D", "ANN", "S101", "S603", "S607", "SIM905"]
# The demo generates synthetic visualization data; `random` is not used for security.
"react_globe_gl_demo/*" = ["D", "ANN", "S311"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["reflex_react_globe_gl"]

[tool.coverage.run]
source = ["custom_components/reflex_react_globe_gl"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.bandit]
exclude_dirs = [".venv", ".web", "tests", "react_globe_gl_demo"]
